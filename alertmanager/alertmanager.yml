global:
  resolve_timeout: 5m
  # Gmail SMTP Configuration
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'your-email@gmail.com'
  smtp_auth_username: 'your-email@gmail.com'
  smtp_auth_password: 'your-16-character-app-password'
  smtp_require_tls: true

route:
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h
  receiver: 'gmail-notifications'

receivers:
  - name: 'gmail-notifications'
    email_configs:
      - to: 'your-email@gmail.com'
        send_resolved: true
        headers:
          subject: '[IDS ALERT] {{ .Status | toUpper }}: {{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})'
        html: |
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <style>
              body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f6f8; margin: 0; padding: 20px; color: #2d3748; }
              .container { max-width: 600px; margin: 0 auto; background: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.08); }
              .header { background: #e53e3e; color: #ffffff; padding: 20px; text-align: center; }
              .header.resolved { background: #38a169; }
              .header h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: 0.5px; }
              .header .status { font-size: 14px; text-transform: uppercase; margin-top: 5px; opacity: 0.9; }
              .body-content { padding: 24px; }
              .alert-card { border-left: 4px solid #e53e3e; background: #fff5f5; padding: 14px; margin-bottom: 16px; border-radius: 0 6px 6px 0; }
              .alert-card.resolved { border-left-color: #38a169; background: #f0fff4; }
              .alert-title { font-size: 16px; font-weight: bold; margin-bottom: 6px; color: #1a202c; }
              .detail-row { font-size: 13px; margin: 4px 0; }
              .detail-label { font-weight: 600; color: #4a5568; display: inline-block; width: 100px; }
              .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; text-transform: uppercase; }
              .badge-critical { background: #fed7d7; color: #9b2c2c; }
              .badge-warning { background: #feebc8; color: #9c4221; }
              .badge-resolved { background: #c6f6d5; color: #22543d; }
              .footer { background: #edf2f7; padding: 14px 20px; font-size: 12px; color: #718096; text-align: center; }
            </style>
          </head>
          <body>
            <div class="container">
              <div class="header {{ if eq .Status "resolved" }}resolved{{ end }}">
                <h1>🚨 Intrusion Detection System</h1>
                <div class="status">{{ .Status | toUpper }} ({{ len .Alerts }} Alert{{ if gt (len .Alerts) 1 }}s{{ end }})</div>
              </div>
              <div class="body-content">
                {{ range .Alerts }}
                <div class="alert-card {{ if eq .Status "resolved" }}resolved{{ end }}">
                  <div class="alert-title">{{ .Labels.alertname }}</div>
                  <div class="detail-row">
                    <span class="detail-label">Severity:</span>
                    <span class="badge {{ if eq .Status "resolved" }}badge-resolved{{ else if eq .Labels.severity "critical" }}badge-critical{{ else }}badge-warning{{ end }}">{{ .Labels.severity }}</span>
                  </div>
                  <div class="detail-row"><span class="detail-label">Component:</span> {{ .Labels.component }}</div>
                  <div class="detail-row"><span class="detail-label">Summary:</span> {{ .Annotations.summary }}</div>
                  <div class="detail-row"><span class="detail-label">Description:</span> {{ .Annotations.description }}</div>
                  <div class="detail-row"><span class="detail-label">Triggered At:</span> {{ .StartsAt }}</div>
                </div>
                {{ end }}
              </div>
              <div class="footer">
                Prometheus Alertmanager &bull; Real-Time Network IDS Pipeline
              </div>
            </div>
          </body>
          </html>
